
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historia de las Calles de Lima</title>
<style>
body{margin:0;font-family:Arial;background:#eef3f7;color:#17324d}
header{background:#103c60;color:white;padding:22px}
h1{font-size:25px}
main{padding:14px;max-width:700px;margin:auto}
section{background:white;padding:18px;margin:14px 0;border-radius:12px}
input{box-sizing:border-box;width:100%;padding:14px;font-size:16px;border:1px solid #aaa;border-radius:8px}
button{background:#08718a;color:white;border:0;border-radius:8px;padding:13px;margin-top:12px;font-size:15px}
article{padding:14px 0;border-bottom:1px solid #ddd}
small{color:#806020}
a{color:#08718a}
</style>
</head>
<body>
<header>
<h1>Historia de las Calles de Lima</h1>
<p>Descubre las calles de Chorrillos</p>
</header>
<main>
<section>
<h2>Buscar calles</h2>
<input id="buscar" placeholder="Escribe el nombre de una calle">
<button onclick="activarGPS()">📍 Buscar calles cercanas</button>
<p id="gps">GPS desactivado.</p>
</section>
<section>
<h2>Calles registradas</h2>
<p id="cantidad"></p>
<div id="resultados"></div>
</section>
</main>
<script>
const calles=[
{n:"10 de Noviembre",lat:-12.1884846,lon:-77.0063697,h:"Origen y fecha de denominación pendientes de verificación."},
{n:"12 de Octubre",lat:-12.1987366,lon:-76.9949078,h:"Nombre asociado a una fecha histórica. No se ha verificado el motivo oficial de su asignación."},
{n:"15 de Agosto",lat:-12.1878011,lon:-76.9787161,h:"Aún no se ha identificado documentalmente el acontecimiento conmemorado."},
{n:"16 de Noviembre",lat:-12.1890674,lon:-77.0035693,h:"Origen de la denominación pendiente de investigación."},
{n:"28 de Julio",lat:-12.1856558,lon:-77.0101433,h:"Fecha de la proclamación de la independencia del Perú. No se ha verificado el acuerdo municipal que dio nombre a esta vía."},
{n:"6 de Enero",lat:-12.1894915,lon:-77.0038079,h:"Origen del nombre pendiente de verificación."},
{n:"Avenida Defensores del Morro",lat:null,lon:null,h:"Anteriormente conocida como avenida Huaylas."},
{n:"Avenida José Olaya",lat:null,lon:null,h:"Se registra como denominación anterior calle del Tren. Falta verificar el tramo exacto."},
{n:"Pasaje Cordillera Chila",lat:null,lon:null,h:"Denominación aprobada por Acuerdo de Concejo 0046-2025-MDCH."}
];
let usuario=null;
function distancia(a,b,c,d){
const r=Math.PI/180;
const x=Math.sin((c-a)*r/2)**2+
Math.cos(a*r)*Math.cos(c*r)*
Math.sin((d-b)*r/2)**2;
return 12742*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function mostrar(){
let q=document.getElementById("buscar").value.toLowerCase();
let datos=calles.filter(c=>c.n.toLowerCase().includes(q)).map(c=>({
...c,
km:usuario&&c.lat!==null?distancia(usuario.lat,usuario.lon,c.lat,c.lon):null
}));
if(usuario)datos.sort((a,b)=>(a.km??Infinity)-(b.km??Infinity));
document.getElementById("cantidad").textContent=datos.length+" calles encontradas. Datos preliminares.";
let cont=document.getElementById("resultados");
cont.replaceChildren();
for(let c of datos){
let art=document.createElement("article");
let titulo=document.createElement("h3");
titulo.textContent=c.n;
let historia=document.createElement("p");
historia.textContent=c.h;
let aviso=document.createElement("small");
aviso.textContent=c.km===null?"Ubicación no disponible":(c.km<1?Math.round(c.km*1000)+" metros":c.km.toFixed(2)+" km")+" aproximadamente";
art.append(titulo,historia,aviso);
if(c.lat!==null){
let p=document.createElement("p");
let a=document.createElement("a");
a.href="https://www.openstreetmap.org/?mlat="+c.lat+"&mlon="+c.lon+"#map=17/"+c.lat+"/"+c.lon;
a.target="_blank";
a.rel="noopener";
a.textContent="Ver ubicación en el mapa";
p.append(a);
art.append(p);
}
cont.append(art);
}
if(!datos.length)cont.textContent="No se encontró la calle.";
}
document.getElementById("buscar").addEventListener("input",mostrar);
function activarGPS(){
let e=document.getElementById("gps");
e.textContent="Buscando ubicación...";
navigator.geolocation.getCurrentPosition(
p=>{
usuario={lat:p.coords.latitude,lon:p.coords.longitude};
e.textContent="GPS activado. Calles ordenadas por distancia.";
mostrar();
},
()=>e.textContent="No se pudo obtener la ubicación. Revisa los permisos.",
{enableHighAccuracy:true,timeout:15000}
);
}
mostrar();
</script>
</body>
</html>
