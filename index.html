
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historia de las Calles de Lima</title>
 <link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef3f7;color:#17324d}
header{background:#103c60;color:white;padding:22px;text-align:center}
h1{font-size:25px;margin:0 0 8px}
header p{margin:0;font-size:14px}
main{max-width:750px;margin:auto;padding:14px}
section{background:white;padding:16px;margin-bottom:14px;border-radius:12px}
input{width:100%;padding:14px;font-size:16px;border:1px solid #aaa;border-radius:8px}
button{background:#08718a;color:white;border:0;border-radius:8px;padding:13px;margin-top:12px;font-size:15px}
article{padding:15px 0;border-bottom:1px solid #ddd}
article h3{margin:0 0 7px}
article p{line-height:1.5}
small{color:#596775}
a{color:#08718a}
.aviso{color:#9a5700;font-size:13px}
#estado{font-size:14px}
</style>
</head>
<body>
<header>
<h1>Historia de las Calles de Lima</h1>
<p>Descubre la historia detrás de cada calle</p>
<p style="font-size:13px; margin-top:10px;">Una iniciativa de Jhoel Calixto</p>
</header>
<main>
<section>
<h2>Buscar calles</h2>
<input id="buscar" placeholder="Escribe el nombre de una calle">
<button onclick="activarGPS()">📍 Buscar calles cercanas</button>
<p id="gps">GPS desactivado.</p>
<p id="estado">Cargando calles...</p>
</section>
<section>
<h2>Calles registradas</h2>
<p id="cantidad"></p>
<div id="resultados"></div>
<button id="mas" onclick="verMas()" style="display:none">Ver más calles</button>
</section>
</main>
<script>
const ID="1ZaYkAI1FU3JfdD9kraw6cZm7Crdvk_-4BPmZ4eqXPpQ";
const HOJAS=[
 {gid:"0",nombre:"Chorrillos"},
 {gid:"18641114",nombre:"Villa El Salvador"},
 {gid:"1282309593",nombre:"Cercado de Lima"}
];
const cargas=new Map();
let calles=[];
let usuario=null;
let limite=30;
const $=id=>document.getElementById(id);

function numero(v){
 const n=Number(v);
 return Number.isFinite(n)?n:null;
}
function distancia(a,b,c,d){
 const r=Math.PI/180;
 const x=Math.sin((c-a)*r/2)**2+
 Math.cos(a*r)*Math.cos(c*r)*
 Math.sin((d-b)*r/2)**2;
 return 12742*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function texto(v){
 return v==null?"":String(v);
}
function recibirCalles(res,hoja){
 if(!res||res.status==="error"||!res.table||!Array.isArray(res.table.rows)){
  finalizarCarga(hoja,null);
  return;
 }
 const datos=res.table.rows.map(f=>{
  const c=f.c||[];
  const v=i=>c[i]?(c[i].v??""):"";
  return {
   nombre:texto(v(3)),
   tipo:texto(v(2)),
   lat:numero(v(4)),
   lon:numero(v(5)),
   historia:texto(v(6)),
   fecha:texto(v(7)),
   verificacion:texto(v(9)),
   publicable:texto(v(11))
  };
 }).filter(c=>c.nombre&&c.publicable==="BORRADOR_NO_OFICIAL");
 finalizarCarga(hoja,datos);
}
function finalizarCarga(hoja,datos){
 const carga=cargas.get(hoja.gid);
 if(!carga||carga.terminada)return;
 carga.terminada=true;
 carga.datos=datos;
 clearTimeout(carga.timer);
 carga.script.remove();
 calles=HOJAS.flatMap(h=>cargas.get(h.gid)?.datos||[]);
 const pendientes=HOJAS.filter(h=>!cargas.get(h.gid)?.terminada);
 const fallidas=HOJAS.filter(h=>{
  const c=cargas.get(h.gid);
  return c?.terminada&&c.datos===null;
 });
 $("estado").textContent=calles.length+" calles cargadas. Información preliminar."+
  (pendientes.length?" Cargando "+pendientes.map(h=>h.nombre).join(", ")+"...":"")+
  (fallidas.length?" No se pudo cargar: "+fallidas.map(h=>h.nombre).join(", ")+". Actualiza la página para reintentar.":"");
 mostrar();
}
function mostrar(){
 const q=$("buscar").value.toLowerCase().trim();
 let datos=calles.filter(c=>
  (c.nombre+" "+c.tipo).toLowerCase().includes(q)
 );
 if(usuario){
  datos=datos.map(c=>({
   ...c,
   km:c.lat!==null&&c.lon!==null?
   distancia(usuario.lat,usuario.lon,c.lat,c.lon):null
  }));
  datos.sort((a,b)=>(a.km??Infinity)-(b.km??Infinity));
 }
 $("cantidad").textContent=datos.length+" calles encontradas";
 const cont=$("resultados");
 cont.replaceChildren();
 datos.slice(0,limite).forEach(c=>{
  const art=document.createElement("article");
  const h=document.createElement("h3");
  h.textContent=c.tipo+" "+c.nombre;
  art.appendChild(h);
  const p=document.createElement("p");
  p.textContent=c.historia||"Historia pendiente de investigación.";
  art.appendChild(p);
  const fecha=document.createElement("small");
  fecha.textContent=c.fecha;
  art.appendChild(fecha);
  const aviso=document.createElement("p");
  aviso.className="aviso";
  aviso.textContent="Estado: "+(c.verificacion||"Sin verificar");
  art.appendChild(aviso);
  if(c.km!==undefined&&c.km!==null){
   const d=document.createElement("p");
   d.textContent="📍 A "+c.km.toFixed(2)+" km aproximadamente";
   art.appendChild(d);
  }
  if(c.lat!==null&&c.lon!==null){
   const a=document.createElement("a");
   a.href="https://www.openstreetmap.org/?mlat="+
    c.lat+"&mlon="+c.lon+"#map=17/"+c.lat+"/"+c.lon;
   a.target="_blank";
   a.rel="noopener noreferrer";
   a.textContent="Ver ubicación en el mapa";
   art.appendChild(a);
   
const ruta=document.createElement("a");
ruta.href="https://www.google.com/maps/dir/?api=1&destination="+c.lat+","+c.lon+"&travelmode=driving";
ruta.target="_blank";
ruta.rel="noopener noreferrer";
ruta.textContent="🚗 Cómo llegar";
ruta.style.display="block";
ruta.style.marginTop="12px";
art.appendChild(ruta);

  }
  cont.appendChild(art);
 });
 $("mas").style.display=datos.length>limite?"block":"none";
}
function verMas(){
 limite+=30;
 mostrar();
}
$("buscar").addEventListener("input",()=>{
 limite=30;
 mostrar();
});
function activarGPS(){
 if(!navigator.geolocation){
  $("gps").textContent="GPS no disponible.";
  return;
 }
 $("gps").textContent="Obteniendo ubicación...";
 navigator.geolocation.getCurrentPosition(
  p=>{
   usuario={lat:p.coords.latitude,lon:p.coords.longitude};
   $("gps").textContent="GPS activado. Calles ordenadas por cercanía aproximada.";
   limite=30;
   mostrar();
  },
  ()=>{$("gps").textContent="No se pudo obtener tu ubicación."},
  {enableHighAccuracy:true,timeout:15000}
 );
}
HOJAS.forEach(hoja=>{
 const callback="recibirCalles_"+hoja.gid;
 const script=document.createElement("script");
 const carga={terminada:false,datos:null,script,timer:null};
 cargas.set(hoja.gid,carga);
 window[callback]=res=>recibirCalles(res,hoja);
 script.src="https://docs.google.com/spreadsheets/d/"+
  ID+"/gviz/tq?gid="+hoja.gid+"&tqx="+
  encodeURIComponent("out:json;responseHandler:"+callback);
 script.onerror=()=>finalizarCarga(hoja,null);
 carga.timer=setTimeout(()=>finalizarCarga(hoja,null),20000);
 document.body.appendChild(script);
});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(error => console.error("Error al registrar:", error));
  });
}
</script></body>
</html>
